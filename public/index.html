<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f1e8" />
    <title>破雾 · 你的知乎成长路线</title>
    <style>
      :root {
        --ink: #16231f;
        --muted: #66736d;
        --paper: #f5f1e8;
        --card: rgba(255, 253, 247, 0.82);
        --line: #d9ddd3;
        --green: #176b53;
        --green-dark: #0d4938;
        --orange: #e77b42;
        --shadow: 0 24px 70px rgba(39, 59, 48, 0.12);
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 85% 8%, rgba(231, 123, 66, .18), transparent 24rem),
          radial-gradient(circle at 8% 20%, rgba(23, 107, 83, .15), transparent 26rem),
          var(--paper);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        min-height: 100vh;
      }

      .shell { width: min(1160px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 70px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 64px; }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: -.04em; font-size: 21px; }
      .mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 13px; color: #fff; background: var(--green); box-shadow: 5px 5px 0 #c4d1c5; }
      .badge { border: 1px solid #cdd6ca; border-radius: 999px; padding: 8px 13px; color: var(--green-dark); background: rgba(255,255,255,.45); font-size: 12px; font-weight: 700; }

      .hero { display: grid; grid-template-columns: 1.12fr .88fr; gap: 70px; align-items: end; margin-bottom: 54px; }
      .eyebrow { margin: 0 0 18px; color: var(--orange); font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { max-width: 650px; margin: 0; font-size: clamp(42px, 7vw, 80px); line-height: .98; letter-spacing: -.075em; }
      .hero-copy { max-width: 560px; margin: 24px 0 0; color: var(--muted); font-size: 17px; line-height: 1.75; }
      .hero-note { border-left: 3px solid var(--orange); padding: 10px 0 10px 18px; color: var(--green-dark); font-size: 14px; line-height: 1.6; }

      .panel { border: 1px solid rgba(191, 202, 191, .9); border-radius: 28px; background: var(--card); box-shadow: var(--shadow); backdrop-filter: blur(16px); }
      .form-panel { padding: 28px; }
      .panel-title { display: flex; justify-content: space-between; gap: 16px; align-items: start; margin-bottom: 24px; }
      h2, h3, p { margin-top: 0; }
      h2 { margin-bottom: 7px; font-size: 22px; letter-spacing: -.04em; }
      .hint { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
      label { display: block; margin: 18px 0 8px; color: #35443d; font-size: 13px; font-weight: 750; }
      textarea, input { width: 100%; border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; color: var(--ink); background: rgba(255,255,255,.7); font: inherit; outline: none; transition: border .2s, box-shadow .2s; }
      textarea { min-height: 104px; resize: vertical; line-height: 1.55; }
      textarea:focus, input:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(23,107,83,.1); }
      .fields { display: grid; grid-template-columns: 1fr 130px; gap: 12px; }
      .submit { width: 100%; margin-top: 22px; border: 0; border-radius: 14px; padding: 14px 18px; color: #fff; background: var(--green); font: inherit; font-weight: 800; cursor: pointer; transition: transform .2s, background .2s; }
      .submit:hover { background: var(--green-dark); transform: translateY(-1px); }
      .submit:disabled { cursor: wait; opacity: .65; transform: none; }
      .status { min-height: 20px; margin: 12px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
      .status.error { color: #a5422b; }

      .result { display: none; margin-top: 40px; }
      .result.visible { display: block; }
      .result-head { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 22px; }
      .result-head h2 { font-size: 32px; }
      .route-id { color: var(--muted); font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; text-align: right; }
      .summary { display: grid; grid-template-columns: .75fr 1.25fr; gap: 18px; margin-bottom: 18px; }
      .subpanel { border: 1px solid var(--line); border-radius: 22px; padding: 24px; background: rgba(255,255,255,.52); }
      .subpanel h3 { margin-bottom: 12px; font-size: 16px; letter-spacing: -.025em; }
      .subpanel p { margin-bottom: 0; color: #526159; line-height: 1.75; }
      .caps { display: grid; gap: 10px; }
      .cap { display: grid; grid-template-columns: 9px 1fr; gap: 12px; align-items: start; }
      .cap-dot { width: 9px; height: 9px; margin-top: 6px; border-radius: 50%; background: var(--orange); }
      .cap strong { display: block; margin-bottom: 3px; font-size: 14px; }
      .cap span { color: var(--muted); font-size: 13px; line-height: 1.5; }
      .plan-title { margin: 34px 0 14px; font-size: 21px; letter-spacing: -.04em; }
      .plan { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
      .day { position: relative; min-height: 190px; border: 1px solid var(--line); border-radius: 19px; padding: 18px; background: rgba(255,255,255,.58); }
      .day-number { color: var(--orange); font: 800 12px ui-monospace, monospace; letter-spacing: .08em; }
      .day h3 { margin: 12px 0 10px; font-size: 15px; line-height: 1.35; }
      .day ul { margin: 0; padding-left: 17px; color: #5a6760; font-size: 13px; line-height: 1.55; }
      .acceptance { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); color: var(--green-dark); font-size: 12px; line-height: 1.5; }
      .sources { display: grid; gap: 10px; }
      .source { display: flex; justify-content: space-between; gap: 18px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
      .source:last-child { border-bottom: 0; }
      .source a { color: var(--green); font-weight: 700; text-decoration: none; }
      .source a:hover { text-decoration: underline; }
      .source span { color: var(--muted); font-size: 12px; text-align: right; }
      .empty { color: var(--muted); font-size: 14px; }

      @media (max-width: 820px) {
        .shell { width: min(100% - 28px, 620px); padding-top: 18px; }
        .topbar { margin-bottom: 42px; }
        .hero, .summary { grid-template-columns: 1fr; gap: 25px; }
        .hero { margin-bottom: 34px; }
        .plan { grid-template-columns: repeat(2, 1fr); }
      }
      @media (max-width: 480px) {
        .badge { display: none; }
        h1 { font-size: 48px; }
        .form-panel { padding: 20px; border-radius: 22px; }
        .fields, .plan { grid-template-columns: 1fr; }
        .result-head { display: block; }
        .route-id { margin-top: 8px; text-align: left; }
        .source { display: block; }
        .source span { display: block; margin-top: 5px; text-align: left; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand"><span class="mark">雾</span><span>破雾</span></div>
        <div class="badge">知乎经验 × Pi Agent</div>
      </header>

      <main>
        <section class="hero">
          <div>
            <p class="eyebrow">Find your next step</p>
            <h1>把模糊目标，<br />变成一条路。</h1>
            <p class="hero-copy">告诉我你想去哪里、现在在哪里，以及每周有多少时间。破雾会搜索真实经验，给你一份能马上开始的两周成长路线。</p>
          </div>
          <div class="hero-note">先做出一个小成果，再决定下一步。路线不是答案，是今天可以开始的动作。</div>
        </section>

        <section class="panel form-panel">
          <div class="panel-title">
            <div><h2>生成你的路线</h2><p class="hint">描述得越具体，建议越贴近你。</p></div>
            <span class="eyebrow" style="margin: 4px 0 0">01 / 01</span>
          </div>
          <form id="route-form">
            <label for="goal">你想达成什么目标？</label>
            <textarea id="goal" required maxlength="1000" placeholder="例如：成为能独立开发项目的后端工程师"></textarea>
            <div class="fields">
              <div><label for="background">你的当前情况</label><input id="background" maxlength="3000" placeholder="例如：计算机专业大二，会一点 Java"></div>
              <div><label for="hours">每周投入</label><input id="hours" type="number" min="1" max="80" value="10" required></div>
            </div>
            <button class="submit" type="submit">开始破雾 <span>→</span></button>
            <p id="status" class="status" aria-live="polite"></p>
          </form>
        </section>

        <section id="result" class="result" aria-live="polite">
          <div class="result-head"><div><p class="eyebrow">Your route</p><h2>这就是你的起点</h2></div><div id="route-id" class="route-id"></div></div>
          <div class="summary">
            <article class="subpanel"><h3>行业画像</h3><p id="industry"></p></article>
            <article class="subpanel"><h3>路线摘要</h3><p id="summary"></p></article>
          </div>
          <article class="subpanel"><h3>你要练出的能力</h3><div id="capabilities" class="caps"></div></article>
          <h3 class="plan-title">两周行动计划</h3>
          <div id="plan" class="plan"></div>
          <article class="subpanel" style="margin-top: 18px"><h3>来自知乎的参考</h3><div id="sources" class="sources"></div></article>
        </section>
      </main>
    </div>

    <script>
      const form = document.querySelector("#route-form");
      const status = document.querySelector("#status");
      const result = document.querySelector("#result");
      const submit = form.querySelector("button");
      const text = (value) => String(value ?? "");
      const node = (tag, className, content) => {
        const element = document.createElement(tag);
        if (className) element.className = className;
        if (content !== undefined) element.textContent = content;
        return element;
      };

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submit.disabled = true;
        submit.textContent = "正在搜索真实经验…";
        status.className = "status";
        status.textContent = "Pi 正在整理知乎经验，通常需要几十秒。";
        try {
          const response = await fetch("/api/routes", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              goal: document.querySelector("#goal").value,
              background: document.querySelector("#background").value || undefined,
              profile: { weekly_hours: Number(document.querySelector("#hours").value) },
            }),
          });
          const record = await response.json();
          if (!response.ok) throw new Error(record.error || "生成失败，请稍后重试");
          render(record);
          status.textContent = "路线生成完成。可以从第 1 天开始。";
        } catch (error) {
          status.className = "status error";
          status.textContent = error instanceof Error ? error.message : "生成失败，请稍后重试";
        } finally {
          submit.disabled = false;
          submit.innerHTML = "开始破雾 <span>→</span>";
        }
      });

      function render(record) {
        const plan = record.plan || {};
        document.querySelector("#route-id").textContent = `路线 ID · ${text(record.id)}`;
        document.querySelector("#industry").textContent = text(plan.industry_profile);
        document.querySelector("#summary").textContent = text(plan.summary);
        const capabilities = document.querySelector("#capabilities");
        capabilities.replaceChildren();
        for (const item of plan.capabilities || []) {
          const row = node("div", "cap");
          row.append(node("i", "cap-dot"));
          const copy = node("div");
          copy.append(node("strong", "", text(item.name)));
          copy.append(node("span", "", text(item.reason)));
          row.append(copy);
          capabilities.append(row);
        }
        const planElement = document.querySelector("#plan");
        planElement.replaceChildren();
        for (const day of plan.two_week_plan || []) {
          const card = node("article", "day");
          card.append(node("div", "day-number", `DAY ${text(day.day).padStart(2, "0")}`));
          card.append(node("h3", "", text(day.title)));
          const actions = node("ul");
          for (const action of day.actions || []) actions.append(node("li", "", text(action)));
          card.append(actions);
          card.append(node("div", "acceptance", `完成标准：${text(day.acceptance)}`));
          planElement.append(card);
        }
        const sources = document.querySelector("#sources");
        sources.replaceChildren();
        for (const source of plan.sources || []) {
          const row = node("div", "source");
          const link = node("a", "", text(source.title));
          try {
            const url = new URL(source.url);
            if (url.protocol === "http:" || url.protocol === "https:") {
              link.href = url.href;
              link.target = "_blank";
              link.rel = "noreferrer";
            }
          } catch { /* malformed source URLs remain plain text */ }
          row.append(link, node("span", "", text(source.author)));
          sources.append(row);
        }
        result.classList.add("visible");
        result.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    </script>
  </body>
</html>
